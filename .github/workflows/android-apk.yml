name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      apk_type:
        description: "Android APK target architecture"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - universal
  push:
    branches:
      - feature/cloud-android-apk-build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      # ============================================================================
      # 1. Checkout Repository
      # ============================================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================================
      # 2. Setup Java 17
      # ============================================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ============================================================================
      # 3. Setup Flutter Stable (with tool cache)
      # ============================================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # ============================================================================
      # 4. Cache Gradle Dependencies & Wrapper
      # ============================================================================
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ============================================================================
      # 5. Display Build Environment Information
      # ============================================================================
      - name: Display Environment Info
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== Flutter Version ==="
          flutter --version

      # ============================================================================
      # 6. Install Flutter Dependencies
      # ============================================================================
      - name: Install dependencies
        run: flutter pub get

      # ============================================================================
      # 7. Verify Dart Formatting
      # ============================================================================
      - name: Verify Dart Formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      # ============================================================================
      # 8. Run Flutter Static Analysis
      # ============================================================================
      - name: Run Static Analysis
        run: flutter analyze

      # ============================================================================
      # 9. Run Mobile Test Suite
      # ============================================================================
      - name: Run Flutter Tests
        run: flutter test

      # ============================================================================
      # 10. Build Debug APK (arm64 or universal)
      # ============================================================================
      - name: Build Debug APK
        run: |
          APK_TYPE="${{ github.event.inputs.apk_type }}"
          if [ -z "$APK_TYPE" ]; then
            APK_TYPE="arm64"
          fi
          if [ "$APK_TYPE" = "universal" ]; then
            echo "Compiling Universal Debug APK..."
            flutter build apk --debug
          else
            echo "Compiling arm64 Debug APK..."
            flutter build apk --debug --target-platform android-arm64
          fi

      # ============================================================================
      # 11 & 12. Verify, Stage, and Rename APK Artifact
      # ============================================================================
      - name: Stage APK Artifact
        id: stage
        run: |
          SRC_APK="build/app/outputs/flutter-apk/app-debug.apk"
          if [ ! -f "$SRC_APK" ]; then
            echo "Error: Output APK not found at $SRC_APK" >&2
            exit 1
          fi

          SHORT_SHA=$(git rev-parse --short HEAD)
          APK_TYPE="${{ github.event.inputs.apk_type }}"
          if [ -z "$APK_TYPE" ]; then
            APK_TYPE="arm64"
          fi
          TARGET_NAME="UniversityAttendance-debug-${APK_TYPE}-${SHORT_SHA}.apk"
          ARTIFACT_NAME="university-attendance-debug-${APK_TYPE}-${SHORT_SHA}"
          STAGING_DIR="build/staged-apk"

          mkdir -p "$STAGING_DIR"
          cp "$SRC_APK" "$STAGING_DIR/$TARGET_NAME"

          cd "$STAGING_DIR"
          sha256sum "$TARGET_NAME" > "${TARGET_NAME}.sha256"
          APK_HASH=$(cut -d' ' -f1 "${TARGET_NAME}.sha256")
          APK_SIZE_BYTES=$(stat -c%s "$TARGET_NAME" 2>/dev/null || stat -f%z "$TARGET_NAME")
          APK_SIZE_HUMAN=$(du -h "$TARGET_NAME" | cut -f1)
          cd - > /dev/null

          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "apk_type=$APK_TYPE" >> $GITHUB_OUTPUT
          echo "apk_filename=$TARGET_NAME" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "apk_hash=$APK_HASH" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE_HUMAN ($APK_SIZE_BYTES bytes)" >> $GITHUB_OUTPUT
          echo "staging_dir=$STAGING_DIR" >> $GITHUB_OUTPUT

      # ============================================================================
      # 13. Upload APK Artifact
      # ============================================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: |
            apps/mobile/${{ steps.stage.outputs.staging_dir }}/*.apk
            apps/mobile/${{ steps.stage.outputs.staging_dir }}/*.sha256
          retention-days: 7
          if-no-files-found: error

      # ============================================================================
      # 14. Generate GitHub Step Summary
      # ============================================================================
      - name: Generate Build Summary
        if: always()
        run: |
          FLUTTER_VERSION_SUMMARY=$(flutter --version | head -n 1)
          APK_TYPE="${{ steps.stage.outputs.apk_type || github.event.inputs.apk_type || 'arm64' }}"
          cat << 'EOF' > summary.md
          ## 📱 Android Debug APK Build Summary

          EOF

          if [ "${{ job.status }}" = "success" ]; then
            cat << EOF >> summary.md
          | Property | Value |
          | :--- | :--- |
          | **Build Status** | ✅ **SUCCESS** |
          | **Commit SHA** | \`${{ steps.stage.outputs.short_sha }}\` (\`${{ github.sha }}\`) |
          | **Branch / Ref** | \`${{ github.ref_name }}\` |
          | **Flutter Version** | \`${FLUTTER_VERSION_SUMMARY}\` |
          | **Build Type** | Debug (Development & Physical Device Testing) |
          | **Architecture** | \`${APK_TYPE}\` |
          | **APK Filename** | \`${{ steps.stage.outputs.apk_filename }}\` |
          | **APK Size** | \`${{ steps.stage.outputs.apk_size }}\` |
          | **SHA-256 Checksum** | \`${{ steps.stage.outputs.apk_hash }}\` |
          | **Artifact Name** | \`${{ steps.stage.outputs.artifact_name }}\` |
          | **Retention Period** | 7 Days |
          | **Pre-Build Verification** | Dart Format ✅, Flutter Analyze ✅, Flutter Tests ✅ |

          > [!NOTE]
          > This artifact is an unsigned **DEBUG** build for local testing and physical device development.
          > Download integrity SHA-256 is provided for transfer verification only and is **not** Android production code signing.
          EOF
          else
            cat << EOF >> summary.md
          | Property | Value |
          | :--- | :--- |
          | **Build Status** | ❌ **FAILED** |
          | **Commit SHA** | \`${{ github.sha }}\` |
          | **Branch / Ref** | \`${{ github.ref_name }}\` |
          | **Flutter Version** | \`${FLUTTER_VERSION_SUMMARY}\` |
          | **Architecture** | \`${APK_TYPE}\` |

          > [!WARNING]
          > The build or test verification failed. No valid APK artifact was generated.
          EOF
          fi

          cat summary.md >> $GITHUB_STEP_SUMMARY
