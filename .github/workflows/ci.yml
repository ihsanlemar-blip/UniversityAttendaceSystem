name: CI Pipeline

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Repository Governance & Secret Scanning
  # ============================================================================
  repo-security:
    name: Repository Security & Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run Secret Scan
        run: python scripts/check_secrets.py

      - name: Validate Documentation Integrity
        run: python scripts/check_docs.py

  # ============================================================================
  # 2. FastAPI Backend Static Analysis
  # ============================================================================
  backend-static:
    name: Backend Static Analysis (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff format --check backend/
          ruff check backend/

      - name: Run Mypy Strict Typecheck
        run: |
          mypy backend

  # ============================================================================
  # 3. FastAPI Backend Sharded Integration Tests (Real PostgreSQL 16 & Redis 7)
  # ============================================================================
  backend-shard:
    name: ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: "Backend Shard 1 (Platform & RBAC)"
            id: 1
            tests: "backend/tests/test_api_v1.py backend/tests/test_auth.py backend/tests/test_bootstrap.py backend/tests/test_celery.py backend/tests/test_config.py backend/tests/test_database.py backend/tests/test_errors.py backend/tests/test_health.py backend/tests/test_middleware.py backend/tests/test_passwords.py backend/tests/test_rbac.py backend/tests/test_redis.py backend/tests/test_tokens.py backend/tests/test_types.py backend/tests/test_users.py backend/tests/test_network_resolver.py backend/tests/test_attendance_operations_rbac.py backend/tests/test_import_rbac.py backend/tests/test_report_rbac.py backend/tests/test_import_hardening.py backend/tests/test_security_hardening.py"
          - name: "Backend Shard 2 (Academic Domain & Security)"
            id: 2
            tests: "backend/tests/test_academic_calendar.py backend/tests/test_academic_rbac.py backend/tests/test_academic_units.py backend/tests/test_courses.py backend/tests/test_curriculum_rbac.py backend/tests/test_offerings.py backend/tests/test_people.py backend/tests/test_sections.py backend/tests/test_campus_network_zones.py backend/tests/test_radio_analysis.py backend/tests/test_risk_signals.py backend/tests/test_import_parsers.py backend/tests/test_student_import.py backend/tests/test_lecturer_import.py backend/tests/test_course_import.py backend/tests/test_offering_import.py backend/tests/test_enrollment_import.py"
          - name: "Backend Shard 3 (Facilities, Device Trust & Network)"
            id: 3
            tests: "backend/tests/test_facilities.py backend/tests/test_timetables.py backend/tests/test_occurrences.py backend/tests/test_scheduling_rbac.py backend/tests/test_device_crypto.py backend/tests/test_device_registration.py backend/tests/test_device_replacement.py backend/tests/test_device_rbac.py backend/tests/test_network_presence.py backend/tests/test_security_rbac.py backend/tests/test_timetable_import.py backend/tests/test_performance_burst.py"
          - name: "Backend Shard 4 (Attendance, Presence & Anti-Cheat)"
            id: 4
            tests: "backend/tests/test_attendance_policy.py backend/tests/test_attendance_sessions.py backend/tests/test_attendance_checkpoints.py backend/tests/test_attendance_evaluation.py backend/tests/test_attendance_overrides_and_audit.py backend/tests/test_attendance_rbac.py backend/tests/test_qr_tokens.py backend/tests/test_qr_service.py backend/tests/test_qr_rbac.py backend/tests/test_ble_tokens.py backend/tests/test_ble_service.py backend/tests/test_ble_rbac.py backend/tests/test_offline_crypto.py backend/tests/test_offline_service.py backend/tests/test_offline_reconciliation.py backend/tests/test_offline_rbac.py backend/tests/test_attendance_device_trust.py backend/tests/test_offline_device_trust.py backend/tests/test_attendance_network_integration.py backend/tests/test_attendance_corrections.py backend/tests/test_attendance_operations_e2e.py backend/tests/test_reports.py backend/tests/test_attendance_thresholds.py backend/tests/test_report_exports.py"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: attendance_user
          POSTGRES_PASSWORD: dev_insecure_password
          POSTGRES_DB: attendance_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DATABASE_HOST: "127.0.0.1"
      DATABASE_PORT: 5432
      DATABASE_NAME: attendance_db
      DATABASE_USER: attendance_user
      DATABASE_PASSWORD: dev_insecure_password
      REDIS_URL: "redis://127.0.0.1:6379/0"
      CELERY_BROKER_URL: "redis://127.0.0.1:6379/1"
      CELERY_RESULT_BACKEND: "redis://127.0.0.1:6379/2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run Alembic Database Migrations
        run: |
          alembic -c backend/migrations/alembic.ini upgrade head

      - name: Run Shard Integration Tests
        run: |
          pytest -c backend/pyproject.toml ${{ matrix.shard.tests }} -q --tb=short

  # ============================================================================
  # 4. Next.js Web Frontend Checks
  # ============================================================================
  web-ci:
    name: Web Lint, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run type-check

      - name: Run Linter
        run: npm run lint

      - name: Run Next.js Production Build
        run: npm run build

  # ============================================================================
  # 5. Flutter Mobile Client Checks
  # ============================================================================
  mobile-ci:
    name: Mobile Analyze & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Dart Formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test

  # ============================================================================
  # 6. Final Aggregate Quality Gate
  # ============================================================================
  quality-gate:
    name: Final Quality Gate
    runs-on: ubuntu-latest
    needs: [repo-security, backend-static, backend-shard, web-ci, mobile-ci]
    if: always()
    steps:
      - name: Evaluate Pipeline Status
        run: |
          echo "=========================================="
          echo "      CI PIPELINE RESULTS SUMMARY         "
          echo "=========================================="
          echo "Repository Security: ${{ needs.repo-security.result }}"
          echo "Backend Static:      ${{ needs.backend-static.result }}"
          echo "Backend Shards:      ${{ needs.backend-shard.result }}"
          echo "Web Frontend:        ${{ needs.web-ci.result }}"
          echo "Mobile Client:       ${{ needs.mobile-ci.result }}"
          echo "=========================================="

          if [ "${{ needs.repo-security.result }}" != "success" ] || \
             [ "${{ needs.backend-static.result }}" != "success" ] || \
             [ "${{ needs.backend-shard.result }}" != "success" ] || \
             [ "${{ needs.web-ci.result }}" != "success" ] || \
             [ "${{ needs.mobile-ci.result }}" != "success" ]; then
            echo "[FAILED] One or more quality gates did not succeed. CI Pipeline FAILED."
            exit 1
          fi
          echo "[SUCCESS] All CI quality gates passed successfully!"
